name: What and Why gate tests

on:
  pull_request:
    paths:
      - 'scripts/what-and-why/**'
      - '.github/workflows/what-and-why*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/what-and-why/**'
      - '.github/workflows/what-and-why*.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/what-and-why/lib.test.mjs scripts/what-and-why/check.test.mjs
