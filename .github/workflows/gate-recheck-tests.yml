name: Gate re-check tests

on:
  pull_request:
    paths:
      - 'scripts/gate-recheck/**'
      - 'scripts/what-and-why/lib.mjs'
      - '.github/workflows/gate-recheck*.yml'
      - '.github/workflows/brain-context.yml'
      - '.github/workflows/what-and-why.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gate-recheck/**'
      - 'scripts/what-and-why/lib.mjs'
      - '.github/workflows/gate-recheck*.yml'
      - '.github/workflows/brain-context.yml'
      - '.github/workflows/what-and-why.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/gate-recheck/lib.test.mjs scripts/gate-recheck/recheck.test.mjs scripts/gate-recheck/triggers.test.mjs
