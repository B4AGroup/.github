name: PR intent review tests

on:
  pull_request:
    paths:
      - 'scripts/pr-intent-review/**'
      - '.github/workflows/pr-intent-review*.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/pr-intent-review/**'
      - '.github/workflows/pr-intent-review*.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit tests (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test scripts/pr-intent-review/*.test.mjs
